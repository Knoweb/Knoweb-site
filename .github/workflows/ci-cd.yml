name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './knoweb/package-lock.json'

    - name: Install dependencies
      working-directory: ./knoweb
      run: npm ci

    - name: Lint check
      working-directory: ./knoweb
      run: npm run lint

    - name: Build application
      working-directory: ./knoweb
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: next-build
        path: |
          knoweb/.next
          !knoweb/.next/cache
        include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: next-build
        path: knoweb/.next

    - name: Copy project files to Droplet via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "~/knoweb-site"

    - name: Execute SSH commands (Restart Only)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/knoweb-site/knoweb
          npm install --production
          pm2 restart knoweb || pm2 start npm --name "knoweb" -- start
