name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './knoweb/package-lock.json'

    - name: Install dependencies
      working-directory: ./knoweb
      run: npm ci

    - name: Lint check
      working-directory: ./knoweb
      run: npm run lint

    - name: Build application
      working-directory: ./knoweb
      run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to DigitalOcean Droplet via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/knoweb-site
          git pull origin main
          cd knoweb
          npm install
          npm run build
          pm2 restart knoweb || pm2 start npm --name "knoweb" -- start
